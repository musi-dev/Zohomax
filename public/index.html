<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <!-- Primary SEO -->
  <title>ZOHOMAX (ZMAX) | Web3 Gaming, NFTs & Metaverse</title>

  <meta
    name="description"
    content="Explore ZOHOMAX (ZMAX), a space-themed Web3 metaverse combining blockchain gaming, NFTs, digital assets, immersive experiences, and play-to-earn opportunities."
  />

  <meta
    name="keywords"
    content="ZOHOMAX, ZMAX, Web3 metaverse, blockchain gaming, NFT marketplace, play-to-earn gaming, digital assets, virtual world, metaverse gaming"
  />

  <meta name="author" content="ZMAX NET CORPORATIONS" />
  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  />
  <meta name="googlebot" content="index, follow" />
  <meta name="theme-color" content="#0a84a0" />
  <meta name="color-scheme" content="light" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://zohomax.com/" />

  <!-- Favicon -->
  <link rel="icon" href="%PUBLIC_URL%/logo.jpg" />
  <link
    rel="apple-touch-icon"
    href="%PUBLIC_URL%/logo192.png"
  />

  <!-- Open Graph: Facebook, LinkedIn and Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ZOHOMAX" />
  <meta property="og:url" content="https://zohomax.com/" />

  <meta
    property="og:title"
    content="ZOHOMAX (ZMAX) | Web3 Gaming, NFTs & Metaverse"
  />

  <meta
    property="og:description"
    content="Discover the ZOHOMAX metaverse with Web3 gaming, blockchain technology, NFTs, digital assets, and immersive virtual experiences."
  />

  <meta
    property="og:image"
    content="https://zohomax.com/og-image.jpg"
  />

  <meta
    property="og:image:alt"
    content="ZOHOMAX Web3 Metaverse"
  />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />

  <meta
    name="twitter:title"
    content="ZOHOMAX (ZMAX) | Web3 Gaming & Metaverse"
  />

  <meta
    name="twitter:description"
    content="Explore Web3 gaming, NFTs, blockchain-powered experiences, and the ZOHOMAX virtual universe."
  />

  <meta
    name="twitter:image"
    content="https://zohomax.com/og-image.jpg"
  />

  <!-- PWA Manifest -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ZOHOMAX",
    "alternateName": "ZMAX",
    "url": "https://zohomax.com/",
    "logo": "https://zohomax.com/logo192.png",
    "description": "ZOHOMAX is a space-themed Web3 metaverse focused on blockchain gaming, NFTs, digital assets, and virtual experiences."
  }
  </script>

  <!-- Loading Screen Styles -->
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f4f9fd;
    }

    #root:empty {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    #root:empty::after {
      content: "";
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid #e4f4f8;
      border-top-color: #0a84a0;
      animation: zspin 0.8s linear infinite;
    }

    @keyframes zspin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #root:empty::after {
        animation-duration: 2s;
      }
    }
  </style>
</head>

<body>
  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>

  <div id="root"></div>
</body>
</html>
